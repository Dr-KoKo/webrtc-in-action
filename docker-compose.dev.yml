# Dev compose — fast-iteration bring-up using Dockerfile.dev for
# both services. Use this file for:
#
#   - contributor inner loop (source edits → reload):
#       docker compose -f docker-compose.dev.yml up --build
#   - Playwright e2e (needs Vite dev to serve tests/e2e/test-app/
#     on demand — the prod image only ships the main SPA):
#       docker compose -f docker-compose.dev.yml up -d --build --force-recreate
#       npx playwright test
#
# For the learner / quickstart flow (polished image, distroless
# signaling, healthcheck-gated startup), use the default file:
#
#       docker compose up --build
#
# Env wiring mirrors docker-compose.yml — `.env.example` is the
# single source of truth. No healthcheck here because the dev image
# rebuilds `go build` on every container start and `vite dev` boots
# in ~1 s; a `depends_on: service_started` is enough.
#
# Ports default to 5173 / 8080; override FRONTEND_PORT /
# SIGNALING_PORT in `.env` as with the prod file.

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      # Default empty — T103 makes the same-origin fallback in
      # frontend/src/modes/one-to-one/components/{JoinForm,FailurePanel}.tsx authoritative.
      # Set VITE_SIGNALING_URL explicitly in .env / .env.dev only when
      # signaling lives on a different origin from the frontend.
      VITE_SIGNALING_URL: ${VITE_SIGNALING_URL:-}
    depends_on:
      - signaling

  signaling:
    build:
      context: ./signaling
      dockerfile: Dockerfile.dev
    ports:
      - "${SIGNALING_PORT:-8080}:8080"
    environment:
      # Dev persona defaults — matches .env.dev.example even if a
      # contributor runs this file without `--env-file .env.dev`.
      # The prod persona (json / info, APP_ENV=prod with explicit
      # WS_ALLOWED_ORIGINS) lives in docker-compose.yml.
      APP_ENV: ${APP_ENV:-dev}
      # WS_ALLOWED_ORIGINS unset on purpose: dev profile + empty list
      # → permissive WS origin policy (InsecureSkipVerify=true), so
      # the Vite dev server on a different port can connect freely.
      # Set this env var to lock down dev origins as well.
      WS_ALLOWED_ORIGINS: ${WS_ALLOWED_ORIGINS:-}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      SIGNALING_PORT: "8080"
      PING_INTERVAL_MS: ${PING_INTERVAL_MS:-5000}
      PONG_TIMEOUT_MS: ${PONG_TIMEOUT_MS:-5000}
      ICE_STUN_URLS: ${ICE_STUN_URLS:-stun:stun.l.google.com:19302}
      ICE_TURN_URL: ${ICE_TURN_URL:-}
      ICE_TURN_USERNAME: ${ICE_TURN_USERNAME:-}
      ICE_TURN_CREDENTIAL: ${ICE_TURN_CREDENTIAL:-}
